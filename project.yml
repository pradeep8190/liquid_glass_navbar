name: LiquidGlassNavBar
options:
  bundleIdPrefix: com.liquidglass
  deploymentTarget:
    iOS: 17.0
targets:
  LiquidGlassNavBar:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - ContentView.swift
      - LiquidGlassApp.swift
    info:
      path: Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.liquidglass.navbar
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGN_IDENTITY: ""
