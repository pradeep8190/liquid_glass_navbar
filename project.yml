name: LiquidGlassNavBar
options:
  bundleIdPrefix: com.liquidglass
  deploymentTarget:
    iOS: 17.0
targets:
  LiquidGlassNavBar:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - ContentView.swift
      - LiquidGlassApp.swift
    info:
      path: Info.plist
    scheme:
      build:
        targets:
          LiquidGlassNavBar: all
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidglass.navbar
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
